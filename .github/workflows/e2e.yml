# Full-stack end-to-end tests.
#
# Runs the whole application in the job - PostgreSQL, the FastAPI backend under
# uvicorn, and the production frontend bundle served by vite preview - then
# drives it with a real browser. Nothing here touches AWS and no secrets are
# needed, so it runs on pull requests from forks too.
#
# This is a separate workflow rather than a gate on the deploy jobs: installing
# a browser and booting the stack adds several minutes, and the unit suites
# already cover the same logic. Make `deploy` depend on it by adding this job
# to its `needs:` list if you would rather trade deploy latency for the check.

name: End-to-End

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devtest
          POSTGRES_DB: acme_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The backend reads every connection field from the environment, so
      # pointing it at the service container needs no code change.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_NAME: acme_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASS: devtest
      IS_LOCAL: 'true'
      JWT_SECRET: e2e-signing-key
      API_URL: http://127.0.0.1:8000

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/facility-api/requirements.txt uvicorn

      - name: Start the backend
        working-directory: backend/facility-api
        run: |
          nohup uvicorn --app-dir . --host 127.0.0.1 --port 8000 app.main:app > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "${API_URL}/health" > /dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not start"
          cat /tmp/api.log
          exit 1

      - name: Seed demo data
        run: ./bin/seed-database.py --url "${API_URL}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build the frontend against the local backend
        working-directory: frontend
        env:
          # Overrides any .env file: the bundle must talk to the backend started
          # above, not to a deployed one.
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show backend logs when something fails
        if: failure()
        run: tail -n 100 /tmp/api.log
