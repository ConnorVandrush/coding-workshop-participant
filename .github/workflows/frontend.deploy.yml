# Test and deploy the frontend when it changes.
#
# See .github/workflows/backend.deploy.yml for why this is GitHub Actions rather
# than CodePipeline.
#
# The gate is lint + dependency audit + the Vitest suite + a production build.
# `npm test` runs `vitest run`, never watch mode, so it terminates in CI.
#
# Required repository secrets for the deploy job:
#   PARTICIPANT_ID    - your participant id, e.g. 0922f9b2
#   PARTICIPANT_CODE  - the code from your workshop email
#   EVENT_ID          - the workshop event id (optional, defaults to abcd1234)
#   PARTICIPANT_URL   - optional; skips the DNS lookup if set

name: Frontend - Test and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.deploy.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        # No npm cache: .gitignore excludes package-lock.json*, so a clean
        # checkout has no lockfile and setup-node's cache step fails outright
        # with "Dependencies lock file is not found".

      - name: Install dependencies
        working-directory: frontend
        # This repository git-ignores package-lock.json, so `npm install` is the
        # normal path here; `npm ci` is used only if a lockfile is ever committed.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy
    needs: test
    # Deploy on a push to main and on a manual run, but never on a pull
    # request: fork PRs get no secrets, and PRs must not reach AWS.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check deployment credentials are configured
        id: guard
        env:
          PARTICIPANT_CODE: ${{ secrets.PARTICIPANT_CODE }}
          PARTICIPANT_ID: ${{ secrets.PARTICIPANT_ID }}
        run: |
          if [ -n "$PARTICIPANT_CODE" ] && [ -n "$PARTICIPANT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PARTICIPANT_ID / PARTICIPANT_CODE not set - skipping deployment."
          fi

      - name: Install Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deployment tooling
        if: steps.guard.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq dnsutils

      - name: Install Terraform
        if: steps.guard.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      # deploy-frontend.sh reads the bucket and API URL from `terraform output`
      # but never runs `terraform init`, so on a fresh runner there is no
      # backend configured, every output resolves empty, and the script aborts
      # with "Could not get S3 bucket name from Terraform outputs". Minting
      # credentials and initialising the backend first makes the outputs
      # readable.
      - name: Initialise Terraform state
        if: steps.guard.outputs.ready == 'true'
        env:
          PARTICIPANT_ID: ${{ secrets.PARTICIPANT_ID }}
          PARTICIPANT_CODE: ${{ secrets.PARTICIPANT_CODE }}
          EVENT_ID: ${{ secrets.EVENT_ID }}
          PARTICIPANT_URL: ${{ secrets.PARTICIPANT_URL }}
          AWS_REGION: us-east-2
        run: |
          ./bin/setup-participant.sh
          set -a && . ./ENVIRONMENT.config && set +a
          cd infra
          terraform init -reconfigure \
            -backend-config="bucket=coding-workshop-tfstate-${PARTICIPANT_ID}" \
            -backend-config="region=${AWS_REGION}"
          echo "Bucket: $(terraform output -raw s3_bucket_name)"

      # deploy-frontend.sh runs `npm run build` without installing first, which
      # works on a developer machine that already has node_modules but not in a
      # clean job - and Deploy is a separate job from Test, so it does not
      # inherit the earlier install.
      - name: Install frontend dependencies
        if: steps.guard.outputs.ready == 'true'
        working-directory: frontend
        run: npm install

      - name: Deploy frontend
        if: steps.guard.outputs.ready == 'true'
        env:
          PARTICIPANT_ID: ${{ secrets.PARTICIPANT_ID }}
          PARTICIPANT_CODE: ${{ secrets.PARTICIPANT_CODE }}
          EVENT_ID: ${{ secrets.EVENT_ID }}
          PARTICIPANT_URL: ${{ secrets.PARTICIPANT_URL }}
          AWS_REGION: us-east-2
        # deploy-frontend.sh reads the API URL from the Terraform outputs,
        # exports VITE_API_URL, runs the production build, syncs it to S3 and
        # invalidates the CloudFront distribution.
        run: ./bin/deploy-frontend.sh aws

      - name: Verify the site is serving
        if: steps.guard.outputs.ready == 'true'
        run: |
          cd infra
          SITE=$(terraform output -raw website_url 2>/dev/null || echo "")
          if [ -z "$SITE" ]; then
            echo "::warning::Could not read website_url; skipping smoke test."
            exit 0
          fi
          echo "Smoke testing $SITE"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Site is serving (HTTP 200)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site did not return HTTP 200 after deployment."
          exit 1

      # The unit and end-to-end suites both run against a local stack, so
      # neither can see how CloudFront treats a response. It once rewrote every
      # 404 into a 200 serving index.html, which broke the API's "not found"
      # path, while client-side routes returned S3's raw 403 AccessDenied XML -
      # and every test stayed green through both. This is the only place those
      # two failures are visible.
      - name: Verify CloudFront routing and status passthrough
        if: steps.guard.outputs.ready == 'true'
        run: |
          cd infra
          SITE=$(terraform output -raw website_url 2>/dev/null || echo "")
          if [ -z "$SITE" ]; then
            echo "::warning::Could not read website_url; skipping routing checks."
            exit 0
          fi
          FAILED=0

          # A client-side route has no object behind it and must still serve the app.
          for ROUTE in /incidents /dashboard /incidents/42; do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "$SITE$ROUTE" || echo 000)
            if [ "$CODE" != "200" ] || ! grep -qi "<!doctype html" /tmp/body; then
              echo "::error::$ROUTE returned $CODE and did not serve the app shell."
              FAILED=1
            fi
          done

          # An unknown API path must keep the API's own 404, not become the app.
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 \
            "$SITE/api/facility-api/incidents/99999999" \
            -H 'authorization: Bearer definitely-not-a-token' || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "::error::CloudFront rewrote an API error into HTTP 200."
            head -c 200 /tmp/body
            FAILED=1
          fi
          if grep -qi "<!doctype html" /tmp/body; then
            echo "::error::An API path served the app shell instead of a JSON error."
            FAILED=1
          fi

          exit $FAILED
